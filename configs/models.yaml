# Model Configuration for V-Loan
logistic_regression:
  C: 1.0
  solver: "lbfgs"
  max_iter: 1000
  random_state: 42

random_forest:
  n_estimators: 150
  max_depth: 8
  min_samples_split: 5
  min_samples_leaf: 2
  random_state: 42
  n_jobs: 1

gradient_boosting:
  n_estimators: 100
  learning_rate: 0.1
  max_depth: 4
  min_samples_split: 5
  subsample: 0.8
  random_state: 42

mlp_dnn:
  hidden_layer_sizes: [128, 64]
  activation: "relu"
  solver: "adam"
  alpha: 0.0001
  batch_size: 64
  learning_rate_init: 0.001
  max_iter: 500
  early_stopping: true
  n_iter_no_change: 20
  random_state: 42
