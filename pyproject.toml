[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verification-first-loan-approval"
version = "2.0.0"
description = "Verification-First Loan Approval: A Verification-First Framework for Trustworthy Explanations and Counterfactual Recourse in Loan Approval"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Verification-First Loan Approval Research Team"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyyaml>=6.0.1",
    "joblib>=1.3.0",
    "pytest>=7.4.0",
    "tabulate>=0.9.0",
    "shap>=0.44.0",
    "lime>=0.2.0.1",
    "dice-ml>=0.11",
    "statsmodels>=0.14.0",
    "openpyxl>=3.1.2"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
